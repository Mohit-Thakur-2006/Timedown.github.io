
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <script>
        (function() {
            var appId = "com.mjtech.radhe";
            var webUrl = "https://play.google.com/store/apps/details?id=" + appId;
            var appUrl = "market://details?id=" + appId;

            // Android user ke liye sidha native Play Store app open karega (Browser delay khatam)
            if (/android/i.test(navigator.userAgent)) {
                window.location.replace(appUrl);
                setTimeout(function() {
                    window.location.replace(webUrl);
                }, 800);
            } else {
                window.location.replace(webUrl);
            }
        })();
    </script>
    <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.mjtech.radhe">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhakti Marg App </title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f2f2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 10px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c7be5; margin: 0 0 10px; font-size: 22px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2c7be5; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        a { color: #2c7be5; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="box">
    <h1>Bhakti Marg App</h1>
    <div class="loader"></div>
    <p>Opening Google Play Store...</p>
    <a href="https://play.google.com/store/apps/details?id=com.mjtech.radhe">Click here if not redirected automatically</a>
</div>
</body>
</html>
